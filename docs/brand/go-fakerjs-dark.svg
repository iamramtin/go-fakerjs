  <rect x="80" y="35" width="12" height="10" rx="5" fill="#5fd3c4" opacity="0.45"/>
  <rect x="46" y="51" width="18" height="10" rx="5" fill="#5fd3c4"/>
  <rect x="70" y="51" width="28" height="10" rx="5" fill="#5fd3c4" opacity="0.45"/>
  <rect x="46" y="67" width="40" height="10" rx="5" fill="#5fd3c4"/>
  <rect x="46" y="83" width="12" height="10" rx="5" fill="#5fd3c4"/>
  <rect x="64" y="83" width="22" height="10" rx="5" fill="#5fd3c4" opacity="0.45"/>
