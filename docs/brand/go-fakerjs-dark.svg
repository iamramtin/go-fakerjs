  <rect x="30" y="51" width="10" height="10" rx="2.5" fill="#5fd3c4" opacity="0.32"/>
  <rect x="30" y="67" width="10" height="10" rx="2.5" fill="#5fd3c4" opacity="0.32"/>
  <rect x="30" y="83" width="10" height="10" rx="2.5" fill="#5fd3c4" opacity="0.32"/>
  <!-- generated values, each row different -->
